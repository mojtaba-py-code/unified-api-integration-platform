# Unified API Integration Platform — runtime configuration.
# Everything here is data: adding or tuning a connector never requires code changes.

app:
  name: "Unified API Integration Platform"
  database_path: "data/unified.db"
  cache_ttl_seconds: 300

http:
  timeout_seconds: 10.0
  retry:
    max_attempts: 3
    base_delay_seconds: 0.5
    max_delay_seconds: 5.0
  rate_limit:
    requests_per_second: 5.0
  circuit_breaker:
    failure_threshold: 5
    reset_timeout_seconds: 30.0

connectors:
  weather:
    enabled: true
    base_url: "https://api.open-meteo.com/v1"
  crypto:
    enabled: true
    base_url: "https://api.coingecko.com/api/v3"
  github:
    enabled: true
    base_url: "https://api.github.com"
