[project]
name = "unified-api-platform"
version = "1.0.0"
description = "A pluggable platform that concurrently integrates multiple external APIs behind a single unified interface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mojtaba Karimi", email = "mojtaba.python@gmail.com" }]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52",
    "httpx>=0.27",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "PyYAML>=6.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
]

[project.scripts]
unified-api = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() pattern in defaults

[tool.mypy]
python_version = "3.11"
packages = ["app"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["aiosqlite.*", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage is measured on every run and is a gate, not a report: the floor is
# below where the suite sits today so ordinary work is not blocked, but a
# change that guts the tests fails instead of quietly passing.
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=70"

[tool.bandit]
# Tests deliberately exercise weak inputs and assert on failure paths.
exclude_dirs = ["tests"]
