name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # bandit and pip-audit only know the advisories that existed the last time
  # they ran, so on a quiet repository their verdict silently goes stale.
  # Re-run the whole pipeline weekly against a fresh advisory database.
  schedule:
    - cron: "0 6 * * 1"

# The pipeline only reads the checkout.  Any job needing more asks for it
# explicitly at the job level.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and security tooling
        run: |
          # setuptools is preinstalled on the runner and has had CVEs of its
          # own; pip-audit sees the whole environment, so upgrade it here
          # rather than let the runner's build tooling fail the audit.
          python -m pip install --upgrade pip setuptools
          pip install -e .
          pip install bandit pip-audit

      - name: Bandit (static analysis)
        run: bandit -c pyproject.toml -r app --severity-level medium

      # Audits the resolved dependency tree, so a CVE in a transitive package
      # fails the build rather than waiting to be noticed.
      - name: pip-audit (dependency CVEs)
        run: pip-audit --skip-editable --progress-spinner off

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A credential that was committed and later deleted is still leaked,
          # so scanning only the tip would miss the case that matters most.
          fetch-depth: 0

      - name: Scan every commit for credential-shaped strings
        run: |
          set -euo pipefail
          # Deliberately high-signal: recognisable key material, plus a
          # long value assigned to a secret-sounding name. The empty
          # placeholders in .env.example have nothing after the "=", so
          # they do not trip it. This file is excluded because it quotes
          # the very shapes it looks for.
          patterns='-----BEGIN [A-Z ]*PRIVATE KEY-----'
          patterns="$patterns"'|AKIA[0-9A-Z]{16}'
          patterns="$patterns"'|gh[pousr]_[A-Za-z0-9]{30,}'
          patterns="$patterns"'|github_pat_[A-Za-z0-9_]{30,}'
          patterns="$patterns"'|xox[abprs]-[A-Za-z0-9-]{10,}'
          patterns="$patterns"'|AIza[0-9A-Za-z_-]{35}'
          patterns="$patterns"'|(api[_-]?key|secret|token|passwd|password)[[:space:]]*[:=][[:space:]]*["]?[A-Za-z0-9/+_=-]{20,}'

          if git grep -I -n -E -i -e "$patterns" $(git rev-list --all) \
              -- ':!.github/workflows/ci.yml'; then
            echo "::error::a credential-shaped string is present in the history"
            echo "Rotate the credential first: deleting the commit does not un-leak it."
            exit 1
          fi
          echo "No credential-shaped strings found in $(git rev-list --count --all) commits."
